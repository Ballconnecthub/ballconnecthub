<!DOCTYPE html>
<html>
<head>
    <title>Report Video - Ballconnecthub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #0A66C2;
            padding: 15px 25px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 600px;
            max-width: 94%;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #dc2626;
            text-align: center;
        }

        .video-title {
            color: #0A66C2;
            text-align: center;
            font-weight: bold;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0A66C2;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">
    <a href="/">⚽ Ballconnecthub</a>
</div>

<div class="container">

    <h1>Report Video</h1>

    <p class="video-title">
        {{ video.title }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <label>Reason</label>
        <select name="reason" required>
            <option value="">Select reason</option>
            <option value="spam">Spam</option>
            <option value="copyright">Copyright</option>
            <option value="fake">Fake Account / Fake Video</option>
            <option value="violence">Violence</option>
            <option value="abuse">Abusive Content</option>
            <option value="other">Other</option>
        </select>

        <label>Message</label>
        <textarea
            name="message"
            placeholder="Explain why you are reporting this video..."
        ></textarea>

        <button class="btn" type="submit">
            Submit Report
        </button>
    </form>

    <a class="cancel" href="/video/{{ video.id }}/">
        Cancel
    </a>

</div>

</body>
</html>
