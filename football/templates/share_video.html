<!DOCTYPE html>
<html>
<head>
    <title>Share Video - Ballconnecthub</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #0A66C2;
            margin-bottom: 10px;
        }

        .video-title {
            color: #333;
            margin-bottom: 20px;
        }

        #shareLink {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn {
            margin-top: 15px;
            background: #0A66C2;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn:hover {
            background: #084a9e;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #0A66C2;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            color: #16A34A;
            margin-top: 12px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>⚽ Share This Football Video</h2>

    <p class="video-title">
        <strong>{{ video.title }}</strong>
    </p>

    <input
        id="shareLink"
        type="text"
        value="{{ share_link }}"
        readonly
    >

    <br>

    <button class="btn" onclick="copyLink()">
        Copy Link
    </button>

    <div id="copyMessage" class="message">
        ✅ Link copied successfully!
    </div>

    <br>

    <a class="back" href="/video/{{ video.id }}/">
        ← Back to Video
    </a>

</div>

<script>
    function copyLink() {
        const link = document.getElementById("shareLink");

        link.select();
        link.setSelectionRange(0, 99999);

        navigator.clipboard.writeText(link.value);

        document.getElementById("copyMessage").style.display = "block";
    }
</script>

</body>
</html>
