<h2>Delete Video</h2>

<p>Are you sure you want to delete this video?</p>

<h3>{{ video.title }}</h3>

<form method="POST">
    {% csrf_token %}
    <button type="submit" style="background:red; color:white; padding:10px;">
        Yes, delete this video
    </button>
</form>

<br>

<a href="/profile/{{ user.username }}/">Cancel</a>
